[package]
name = "zonemail"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "*", features = [
    "cookie",
    "fix-http1-request-uri",
    "server",
    "server-handle",
    "http1",
    "http2",
    "http2-cleartext",
    "quinn",
    "rustls",
    "native-tls",
    "openssl",
    "unix",
    "socket2",
    "tower-compat",
    "anyhow",
    "test",
    "affix-state",
    "basic-auth",
    "craft",
    "force-https",
    "jwt-auth",
    "catch-panic",
    "compression",
    "logging",
    "proxy",
    "concurrency-limiter",
    "rate-limiter",
    "sse",
    "trailing-slash",
    "timeout",
    "websocket",
    "request-id",
    "caching-headers",
    "cache",
    "cors",
    "csrf",
    "flash",
    "session",
    "serve-static",
    "otel",
    "oapi",
    "rfc9457",
    "aws-lc-rs",
    "matched-path",
    "tus",
] }
config = "*"
tokio = { version = "*", features = ["full"] }

toasty = { version = "*", features = ["turso", "postgresql", "jiff"] }
    # Direct dep so we can name `TransactionMode` (not re-exported by `toasty`)
    # for the atomic, write-locked claim used by the outbound worker.
    toasty-core = "0.10"
jiff = { version = "*", features = ["serde"] }
toasty-driver-turso = "*"
toasty-cli = "*"
turso = "*"
tracing = "*"
tracing-subscriber = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
rust-embed = "*"

# Mail & DNS Crates
lettre = { version = "*", features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
smtpd = "*"
mail-parser = "*"
# hickory 0.26+ is the recommended fix for RUSTSEC-2026-0119, but
# hickory-proto 0.26.3 does not compile on rustc 1.95 (missing trait impls on
# RecordType: Clone/Copy/Eq/Hash/Debug). Pinned to 0.24 until the upstream
# build is fixed. Ignored in .cargo/audit.toml.
hickory-server = "0.24"
hickory-resolver = "0.24"
hickory-proto = "0.24"

# Utilities
thiserror = "*"
