[package]
name = "zonemail"
version = "0.1.0"
edition = "2024"
description = "Lightweight self-contained email + DNS service: REST API, authoritative DNS, inbound SMTP, and outbound delivery in one Rust binary/lib"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/afmkt/zonemail"
homepage = "https://github.com/afmkt/zonemail"
keywords = ["email", "smtp", "dns", "mailcatcher", "forwarder"]
categories = ["email", "network-programming", "web-programming::http-server", "database"]

[dependencies]
salvo = { version = "0.96", features = [
    "cookie",
    "fix-http1-request-uri",
    "server",
    "server-handle",
    "http1",
    "http2",
    "http2-cleartext",
    "quinn",
    "rustls",
    "native-tls",
    "openssl",
    "unix",
    "socket2",
    "tower-compat",
    "anyhow",
    "test",
    "affix-state",
    "basic-auth",
    "craft",
    "force-https",
    "jwt-auth",
    "catch-panic",
    "compression",
    "logging",
    "proxy",
    "concurrency-limiter",
    "rate-limiter",
    "sse",
    "trailing-slash",
    "timeout",
    "websocket",
    "request-id",
    "caching-headers",
    "cache",
    "cors",
    "csrf",
    "flash",
    "session",
    "serve-static",
    "otel",
    "oapi",
    "rfc9457",
    "aws-lc-rs",
    "matched-path",
    "tus",
] }
config = "0.15"
tokio = { version = "1", features = ["full"] }

toasty = { version = "0.10", features = ["turso", "postgresql", "jiff"] }
    # Direct dep so we can name `TransactionMode` (not re-exported by `toasty`)
    # for the atomic, write-locked claim used by the outbound worker.
    toasty-core = "0.10"
jiff = { version = "0.2", features = ["serde"] }
toasty-driver-turso = "0.10"
turso = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"

# Mail & DNS Crates
lettre = { version = "0.11", features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
smtpd = "0.1"
mail-parser = "0.11"
# hickory 0.26+ is the recommended fix for RUSTSEC-2026-0119, but
# hickory-proto 0.26.3 does not compile on rustc 1.95 (missing trait impls on
# RecordType: Clone/Copy/Eq/Hash/Debug). Pinned to 0.24 until the upstream
# build is fixed. Ignored in .cargo/audit.toml.
hickory-server = "0.24"
hickory-resolver = "0.24"
hickory-proto = "0.24"

# Utilities
thiserror = "1"

# `http` types are used by the auth layer when constructing/inspecting request
# URIs and headers (e.g. the `enforce` decision tests). It is already in the tree
# via `salvo`/`reqwest`; declared here so the crate can name `http::Uri` directly.
http = "1"

# JWT verification for the HTTP API auth layer. The `aws-lc-rs` crypto backend
# it needs comes for free via salvos `aws-lc-rs` feature, so no extra feature is
# selected here (RustCrypto and aws-lc-rs must not be enabled simultaneously, and
# only aws-lc-rs is in the graph).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.22"

# Async HTTP client used only when key material is sourced *dynamically* from an
# auth server (e.g. Janux) — `auth.keys.kind = "jwks_remote"`/`"issuer"` — to
# fetch a rotating JWKS / OIDC discovery. rustls to match the service's TLS
# stack; no default features keeps the footprint minimal.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[features]
default = []
# Gate for test-only constructors (e.g. `ServiceManager::for_test`) so the
# black-box integration tests can build a manager without opening a real
# socket. Enabled only in dev via the self dev-dependency below.
test-support = []

[dev-dependencies]
# Re-depend on the crate itself with `test-support` so the integration tests
# can reach `ServiceManager::for_test` (a `#[cfg(test)]`-gated item inside the
# library is otherwise invisible to a separate test crate).
zonemail = { path = ".", features = ["test-support"] }

# DB migrations are driven by the `toasty` CLI, not by Rust code in this crate.
# Kept as a dev-dep so the binary exists for local migration work, but NOT a
# normal dependency, so it does not leak into a consumer of the published
# `zonemail` library's build graph.
toasty-cli = "0.10"
