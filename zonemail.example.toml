# Example configuration for zonemail.
#
# Copy to `zonemail.toml` in the working directory (or bind-mount it into a
# container at the working dir) and edit. Every field has a default, so an
# empty / missing file is fine.
#
# Any field can be overridden by an environment variable using the prefix
# `ZONEMAIL` and the `__` separator, e.g.:
#     ZONEMAIL__API=8081  ZONEMAIL__DNS=53  ZONEMAIL__SMTP=25  ZONEMAIL__MODE=smtp

# Bind address shared by the API, DNS and SMTP listeners.
host = "0.0.0.0"

# Listener ports. 53 / 25 are privileged — in a container either run with
# `--cap-add NET_BIND_SERVICE`, or override to unprivileged ports, e.g.
# `ZONEMAIL__DNS=5353 ZONEMAIL__SMTP=2525`.
dns = 53
smtp = 25
api = 8081

# Which controllable listeners to start at boot. One of:
#     "full"   - API + SMTP + DNS (default; the historical always-on behaviour)
#     "api"    - API only
#     "smtp"   - inbound SMTP only
#     "dns"    - DNS only
#     "off"    - no controllable listener (mount the routes via Daemon::routes)
#
# This is only the *startup* mode. At runtime the API can start/stop a service
# (`POST /services/{service}/start|stop`) or switch modes (`POST /services/mode`).
# The outbound delivery worker is not controllable - the runtime that owns the
# daemon drives it independently.
mode = "full"

# Toasty/libsql (turso) data source. A local libsql file is the default;
# point at a remote turso endpoint with a `libsql://...?authToken=...` URL.
database_url = "turso:zonemail.db"

# Domains this instance provisions.
domains = []

# Pre-seeded DNS records (FQDN form).
records = []

# Pre-provisioned mailboxes (full email addresses). Two forms are accepted:
#
#   "user@example.com"                          — store-only, no forward
#   { id = "user2@example.com", forward_to = "user2@gmail.com" } — forwarded
#
# Mixing forms is fine:
# mailboxes = [
#      "info@example.com",                                  # store-only
#      { id = "billing@example.com", forward_to = "ops@example.org" },  # forwarded
# ]
mailboxes = []

# ===========================================================================
# HTTP API authentication & authorization (JWT / bearer).
#
# When `enabled = false` (the default) the API is fully open and the guard is a
# pure pass-through - zero behaviour or latency change. Flip `enabled = true` to
# require a valid bearer JWT on every governed route; `health` and `doc` stay
# public so probes/docs remain reachable. Default-deny when enabled - there is no
# opt-out. The model is config-only: zonemail is a *verifier*, not an authz
# server, so roles are declared here and the upstream auth server mints tokens
# that name one of these roles.
#
# auth = {
#    enabled = false,
#
#     # Expected token claims. Leave unset to skip the check.
#    issuer = "https://janux.example.com",
#    audience = "zonemail-api",
#
#     # Tolerance (seconds) for `exp`/`nbf` clock drift.
#    clock_skew_secs = 30,
#
#     # Claim names (configurable). `role_claims` names one or more fields; each
#     # may be a bare string or an array of strings, all unioned into the set.
#    subject_claim = "sub",
#    role_claims = [ "role" ],           # e.g. [ "role", "roles" ]
#
#     # Resources that stay open even when auth is enabled. `health` and `doc` are
#     # public by default; add/remove here.
#    public = [ "health", "doc" ],
#
#     # --- Where the verification key material comes from (exactly one kind) -----
#
#     # (a) Symmetric HMAC secret. Prefer `secret_env` to keep it out of the file:
#     #      kind = "secret"  secret_env = "ZONEMAIL_JWT_SECRET"   # the env var NAME
#     #    ... or inline:
#     #      kind = "secret"  secret     = "a-long-shared-secret"
#     #      kind = "secret"  secret_b64 = "<base64-of-the-secret>"
#
#     # (b) Inline JWKS - a key *set* object written in the config, evaluated locally:
#     #      kind = "jwks"
#     #      jwks = { keys = [ { kty = "RSA", kid = "1", n = "..", e = "AQAB" } ] }
#
#     # (c) Remote JWKS (e.g. Janux) fetched & refreshed in the background:
#     #      kind = "jwks_remote"
#     #      jwks_url = "https://janux.example.com/.well-known/jwks.json"
#     #       # credential presented *to the auth server* (not to zonemail callers):
#     #      janux_auth_header = "Authorization"    # default
#     #      janux_bearer = true                   # default; wrap token as "Bearer .."
#     #      janux_token = "..."                   # or via env, not in this file
#     #       # refresh cadence / cache TTL / fail policy:          (defaults 300/300/true)
#     #      refresh_interval_secs = 300
#     #      cache_ttl_secs = 300
#     #      fail_closed = true                    # deny if source unreachable + empty cache
#
#     # (d) Issuer / OIDC discovery - zonemail fetches
#     #       `<issuer><discovery_path>` for the `jwks_uri` (or uses `jwks_path`):
#     #      kind = "issuer"
#     #      issuer = "https://janux.example.com"
#     #      discovery_path = "/.well-known/openid-configuration"   # default
#     #      jwks_path = ".well-known/jwks.json"                    # bypass discovery
#
#     # Allowed signature algorithms. Blocks `alg=none` and HS<->RS confusion; when
#     # empty the kind's default is used (HS* for `secret`, RS256 otherwise).
#    algorithms = [ "RS256" ],
#   }
#
#   # Named roles. `grants` are `"*"`, `"<resource>:*"`, `"*:<verb>"`, or
#   # "<resource>:<verb>". `extends` inherits another role's grants (unioned).
#   # [auth.roles.admin]
#   #   grants = [ "*" ]
#   #
#   # [auth.roles.viewer]
#   #   grants = [ "domains:read", "records:read" ]
#   #
#   # [auth.roles.ops]
#   #   extends = [ "viewer" ]
#   #   grants = [ "mailboxes:*", "*:read" ]

# ===========================================================================
# Inbound SMTP transport security (STARTTLS + SMTPS).
#
# Omitting this table (or leaving `mode = "none"`) leaves the `smtp` listener
# fully plaintext - the historical behaviour, with zero cost. When TLS is
# enabled, Zonemail builds a single `native_tls::Identity` and shares it across
# two listeners:
#
#   * the `smtp` port gets STARTTLS (RFC 3207) - STARTTLS advertised on port 25,
#     negotiated mid-session. `mode = "optional"` advertises it (STARTTLS-capable
#     but not required); `mode = "required"` makes STARTTLS mandatory before a
#     session may MAIL FROM (the TLS-only "530 Must issue a STARTTLS command
#     first" semantics of the underlying server). Note: the `smtpd` 0.1.x
#     inline-TLS upgrade has known rough edges - `optional` is the tested path;
#     `required` is wired but less battle-tested.
#
#   * `smtps` is a *separate* first-class listener on its own port (the
#     conventional 465 / implicit-TLS port), reachable at `/services` alongside
#     `api` / `smtp` / `dns`. It is config-gated: when `smtps_port` is 0 / unset
#     the Smtps service is dormant. It auto-follows the `smtp` service at boot
#     when configured (no separate mode entry).
#
# Where the cert+key come from:
#   * `kind = "files"` - load the PEM files named by `cert_path` / `key_path` at
#     boot. The key must be a PKCS#8 private key (the `native_tls` backend only
#     accepts PKCS#8; a `BEGIN RSA PRIVATE KEY` / SEC1 key is rejected up front).
#   * `kind = "acme"` - a fail-fast *stub* for future automated certificates via
#     the `acme` crate + a DNS-01 challenge served through this very server's
#     authoritative DNS (the whole point of Zonemail). Selecting it today
#     surfaces a clear "not implemented" error at boot so a deploy fails closed
#     rather than silently falling back to plaintext.
#
# [smtp_tls]
#   mode = "optional"         # "none" | "optional" | "required"
#   smtps_port = 465          # 0 = no separate SMTPS/implicit-TLS listener
#   cert_source = { kind = "files", cert_path = "cert.pem", key_path = "key.pem" }
#
#   # Acme (not implemented - boots a clear error until ACME is wired):
#   #   cert_source = {
#   #      kind = "acme",
#   #      acme_server = "https://acme-staging-v2.letsencrypt.org/directory",
#   #      account_key_path = "acme-account.key",   # EC/P-256 ACME account key
#   #      dns_domain = "example.com",             # authoritative domain to issue for
#   #   }

# ===========================================================================
# Outbound delivery transport security (STARTTLS / SMTPS + optional relay).
#
# This is the *outbound* counter-part of `[smtp_tls]` (which governs *inbound*
# delivery to this server). Omitting `[outbound]` leaves delivery exactly as
# before: a clear-text, unauthenticated MX-to-MX handoff on port 25 - zero cost.
#
#    * `tls` selects the security of the *outbound* SMTP connection:
#        - `plain`         (default) - clear text on `submission_port` (25).
#        - `opportunistic`           - STARTTLS if the peer advertises it, else
#                                       fall back to clear text (MITM-risky;
#                                       dev/test only).
#        - `required`                - STARTTLS is mandatory; a non-TLS peer
#                                       fails the send (MITM-safe).
#        - `implicit`                - implicit TLS from connect (SMTPS; the
#                                       conventional 465). Set
#                                       `submission_port = 465`.
#    * `insecure` (false by default) accepts certificates that fail verification
#      - a dev/localhost self-signed relay. NEVER enable in production.
#    * `relay` fixes a single upstream instead of a per-recipient MX lookup -
#      the production norm (one authenticated provider). When set, every send
#      goes to `relay.host:relay.port` (`relay.port = 0`/omitted =>
#      `submission_port`):
#        - `user` / `password` (or `password_env`, preferred) add `AUTH PLAIN`.
#        - The peer certificate is verified against the system trust store for
#          `relay.host` (hostname + trust), unless `insecure` is set.
#
# [outbound]
#   tls = "required"            # "plain" | "opportunistic" | "required" |
#                               # "implicit"
#   insecure = false
#   submission_port = 587       # 0/omitted => 25 (MX-to-MX); 587 => STARTTLS
#                               # 465 => SMTPS / implicit TLS
#   relay = { host = "smtp.example.com", user = "postmaster",
#             password_env = "ZONEMAIL_SMTP_PASS" }    # AUTH via env (preferred)
#
#    # MX-to-MX with STARTTLS on the recipient's own MX (no relay):
#    # [outbound]
#    #   tls = "required"
#    #   submission_port = 25
#
#    # Send everything through a fixed SMTPS / implicit-TLS relay on 465:
#    # [outbound]
#    #   tls = "implicit"
#    #   submission_port = 465
#    #   relay = { host = "smtp.provider.net", user = "me@example.com",
#    #             password_env = "ZONEMAIL_SMTP_PASS" }
